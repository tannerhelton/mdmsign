# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every advisory below comes in through apple-codesign 0.29.0 (the latest
# release), so it can't be fixed here without forking it. Each entry says why
# mdmsign isn't exposed. cargo-deny warns when an ignore stops matching, so
# prune this list whenever apple-codesign is bumped.
ignore = [
    # zip 2.x: path, symlink and permission problems when *extracting* archives.
    # apple-codesign only writes zips (bundle notarization); mdmsign never
    # extracts one.
    { id = "RUSTSEC-2026-0367", reason = "zip: extraction only; mdmsign never extracts zips" },
    { id = "RUSTSEC-2026-0368", reason = "zip: extraction only; mdmsign never extracts zips" },
    { id = "RUSTSEC-2026-0369", reason = "zip: extraction only; mdmsign never extracts zips" },

    # rsa: Marvin timing side channel. Exploiting it needs an attacker to time
    # many private-key operations; a local CLI signing a handful of files isn't
    # that oracle. No fixed rsa release exists.
    { id = "RUSTSEC-2023-0071", reason = "rsa: no fix upstream; local CLI is not a timing oracle" },

    # rustls 0.21 / rustls-webpki 0.101 / h2 0.3: the legacy hyper 0.14 stack
    # aws-smithy uses to upload to Apple's notary S3 bucket. Only ever talks to
    # AWS endpoints Apple hands back.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3: legacy aws-smithy client, only talks to AWS" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21: Debug impls; mdmsign never debug-prints TLS sessions" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21: legacy aws-smithy client, only talks to AWS" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101: legacy aws-smithy client, only talks to AWS" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101: legacy aws-smithy client, only talks to AWS" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101: CRLs aren't used by the aws-smithy client" },

    # ruzstd: used by `object` to decompress Mach-O/ELF sections. mdmsign only
    # handles .pkg and .mobileconfig files.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd: object-file sections only; mdmsign doesn't parse binaries" },

    # Unmaintained, not vulnerable.
    { id = "RUSTSEC-2020-0095", reason = "difference: unmaintained, used by apple-codesign's own CLI" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, pulled in by serde_yaml" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, pulled in by aws-smithy" },
]

[licenses]
# Permissive licenses only; everything here is compatible with shipping
# mdmsign under MIT OR Apache-2.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# apple-codesign and the AWS SDK pull in several versions of the same crates;
# `cargo tree -d` shows them. Not worth failing CI over.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement to check.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
