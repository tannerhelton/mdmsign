[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tanner Helton <tanner@tannerhelton.com>"]
repository = "https://github.com/tannerhelton/mdmsign"
homepage = "https://github.com/tannerhelton/mdmsign"
keywords = ["macos", "mdm", "codesign", "notarization", "pkg"]
categories = ["command-line-utilities", "development-tools"]

# Versions are pinned exactly; bump them deliberately. The apple-codesign family
# (cryptographic-message-syntax, x509-certificate, apple-xar) must stay on the
# versions apple-codesign itself uses so their types line up.
[workspace.dependencies]
mdmsign-core = { path = "crates/mdmsign-core", version = "=0.1.0" }

anyhow = "=1.0.104"
apple-codesign = { version = "=0.29.0", default-features = false, features = ["notarize"] }
apple-xar = "=0.20.0"
base64 = "=0.22.1"
bcder = "=0.7.7"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
cryptographic-message-syntax = "=0.27.0"
hex = "=0.4.3"
p12-keystore = "=0.2.1"
plist = "=1.10.1"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.1.8"
x509-certificate = "=0.24.0"

assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

# Test certificates use RSA key generation, which is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
