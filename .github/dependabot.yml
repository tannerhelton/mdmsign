# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so a compromised or yanked
    # version has time to be caught before it lands here.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Patch releases are low risk; batch them into one PR. Minor bumps of 0.x
      # crates are breaking in Cargo semver, so those stay as separate PRs.
      cargo-patch:
        update-types: [patch]
    ignore:
      # These must stay on the exact versions apple-codesign itself depends on,
      # or their types stop lining up. Bump them by hand together with
      # apple-codesign (see "Dependency policy" in CONTRIBUTING.md).
      - dependency-name: cryptographic-message-syntax
      - dependency-name: x509-certificate
      - dependency-name: apple-xar

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # release.yml is generated by dist; update it by bumping
    # cargo-dist-version in dist-workspace.toml and running `dist generate`.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      github-actions:
        patterns: ["*"]
