name: Publish to crates.io

# Called by release.yml (a dist custom publish job) after the GitHub Release
# is created. Authenticates with crates.io trusted publishing, so there's no
# long-lived registry token. crates.io matches the *calling* workflow, so the
# trusted publisher for both crates is `release.yml` (see CONTRIBUTING.md).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Skips versions that are already on crates.io, so a rerun after a
      # partial publish works, and so does a first release published by hand
      # (trusted publishing can only be set up once a crate exists).
      - name: Find crates to publish
        id: todo
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          version=$(jq -r '.releases[0].app_version' <<<"$PLAN")
          crates=""
          for crate in mdmsign-core mdmsign; do
            if curl -fsS -o /dev/null -A "mdmsign release (https://github.com/tannerhelton/mdmsign)" \
                "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              crates="$crates $crate"
            fi
          done
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      - if: steps.todo.outputs.crates != ''
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - if: steps.todo.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # In dependency order: mdmsign-core first. cargo waits for each to be
      # indexed before publishing the next.
      - if: steps.todo.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.todo.outputs.crates }}
        run: |
          for crate in $CRATES; do
            cargo publish -p "$crate" --locked
          done
